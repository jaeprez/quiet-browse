<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0d"><title>QuietBrowse v3</title>
<style>:root{color-scheme:dark;--b:#080a0d;--p:#11151a;--l:#29303a;--t:#f4f6f8;--m:#9099a5;--a:#d9ff62}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:env(safe-area-inset-bottom)}header{position:sticky;top:0;z-index:9;background:#080a0df2;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;backdrop-filter:blur(16px)}.bar{display:flex;gap:7px}input[type=text]{min-width:0;flex:1;background:var(--p);border:1px solid var(--l);border-radius:13px;color:var(--t);padding:12px;font-size:16px}button{background:#1b2128;border:1px solid #303741;color:var(--t);border-radius:12px;padding:10px 12px;font-weight:700}.go,.on{background:var(--a);color:#111;border-color:var(--a)}main{max-width:850px;margin:auto;padding:12px}.player{aspect-ratio:16/9;background:#000;border-radius:17px;overflow:hidden}.player iframe{width:100%;height:100%}.ph{height:100%;display:grid;place-items:center;color:#666}.card{margin-top:11px;padding:15px;background:var(--p);border:1px solid var(--l);border-radius:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:9px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}.val{color:var(--a)}input[type=range]{width:100%;accent-color:var(--a);margin:16px 0 4px}.muted{color:var(--m);font-size:12px;line-height:1.45}.log{background:#080a0d;padding:10px;border-radius:10px;max-height:220px;overflow:auto;white-space:pre-wrap;font:11px ui-monospace,monospace;color:#aab2bd}.badge{font-size:11px;border:1px solid var(--l);border-radius:999px;padding:5px 8px}.queue{font-size:13px;color:var(--m);margin-top:9px}</style></head>
<body><header><div class="bar"><input id="url" type="text" placeholder="YouTube video or playlist URL"><button id="load" class="go">Load</button></div></header><main>
<div class="player" id="player"><div class="ph">Paste a YouTube URL</div></div>
<section class="card"><div class="row"><b>QuietBrowse v3</b><span class="badge" id="status">READY</span></div><div class="queue" id="queue">Queue empty</div>
<div class="controls"><button id="prev">Previous</button><button id="play">Play</button><button id="next">Next</button></div></section>
<section class="card"><div class="row"><b>Quiet Volume</b><span class="val" id="vtxt">70%</span></div><input id="vol" type="range" min="0" max="100" value="70"><div class="row"><span>Ad reduction</span><span class="val" id="dtxt">60%</span></div><input id="duck" type="range" min="5" max="95" value="60"></section>
<section class="card"><details open><summary>Diagnostics</summary><div id="log" class="log">QuietBrowse v3 initialized.</div></details><p class="muted">Playlist extraction uses YouTube's internal browse interface without requiring your own Data API key. Because that interface is unofficial, YouTube can change it.</p></section>
</main><script>
const $=x=>document.getElementById(x);let yt=null,ready=false,Q=[],qi=0,userVol=70,skipTimer=null;
function L(s){$('log').textContent=new Date().toLocaleTimeString()+'  '+s+'\n'+$('log').textContent}
function S(s){$('status').textContent=s}function parse(u){try{let x=new URL(u),h=x.hostname.replace(/^www\./,'');return{v:h==='youtu.be'?x.pathname.slice(1):x.searchParams.get('v'),list:x.searchParams.get('list')}}catch{return{}}}
function walk(o,out=[]){if(!o||typeof o!=='object')return out;if(o.playlistVideoRenderer?.videoId)out.push({id:o.playlistVideoRenderer.videoId,title:o.playlistVideoRenderer.title?.runs?.map(x=>x.text).join('')||'Video'});for(let k in o)walk(o[k],out);return out}
function tokenWalk(o){if(!o||typeof o!=='object')return null;if(o.continuationItemRenderer){let t=o.continuationItemRenderer.continuationEndpoint?.continuationCommand?.token;if(t)return t}for(let k in o){let t=tokenWalk(o[k]);if(t)return t}return null}
async function inner(body){
 const clients=[
  {clientName:'WEB',clientVersion:'2.20260901.00.00',hl:'en',gl:'US'},
  {clientName:'MWEB',clientVersion:'2.20260901.00.00',hl:'en',gl:'US'}
 ];
 let err;
 for(const client of clients){try{
  let r=await fetch('https://www.youtube.com/youtubei/v1/browse?prettyPrint=false',{method:'POST',headers:{'Content-Type':'application/json','X-YouTube-Client-Name':client.clientName==='WEB'?'1':'2','X-YouTube-Client-Version':client.clientVersion},body:JSON.stringify({context:{client},...body})});
  if(r.ok)return await r.json();err=new Error('HTTP '+r.status)
 }catch(e){err=e}}throw err||new Error('request failed')
}
async function extractPlaylist(id){
 S('EXTRACTING');L('Extracting playlist '+id);let all=[],seen=new Set(),body={browseId:'VL'+id};
 for(let page=0;page<20;page++){let data=await inner(body),items=walk(data);for(const x of items)if(!seen.has(x.id)){seen.add(x.id);all.push(x)};let t=tokenWalk(data);L('Page '+(page+1)+': '+items.length+' entries · total '+all.length);if(!t)break;body={continuation:t}}
 if(!all.length)throw new Error('YouTube returned no playlist entries. Browser CORS/internal API may be blocking extraction.');
 return all
}
function showQ(){$('queue').textContent=Q.length?`${qi+1} / ${Q.length} · ${Q[qi]?.title||Q[qi]?.id}`:'Queue empty'}
function makePlayer(id){
 if(typeof YT==='undefined'||!YT.Player){L('YouTube player API still loading');return}
 if(yt)try{yt.destroy()}catch{};$('player').innerHTML='<div id="ytp"></div>';ready=false;
 yt=new YT.Player('ytp',{videoId:id,playerVars:{playsinline:1,rel:0,autoplay:1},events:{
 onReady:()=>{ready=true;yt.setVolume(userVol);S('PLAYING');showQ();L('Loaded '+id);try{yt.playVideo()}catch{}},
 onStateChange:e=>{if(e.data===0)go(1)},
 onAutoplayBlocked:()=>{S('TAP PLAY');L('Autoplay blocked — tap Play')},
 onError:e=>{L('Video '+id+' error '+e.data+(e.data===101||e.data===150?' (embed disabled)':''));if(e.data===101||e.data===150){clearTimeout(skipTimer);skipTimer=setTimeout(()=>go(1),600)}}
 }})
}
function go(d){if(!Q.length)return;qi=(qi+d+Q.length)%Q.length;showQ();makePlayer(Q[qi].id)}
async function load(){
 let p=parse($('url').value.trim());try{
  if(p.list){Q=await extractPlaylist(p.list);qi=0;L('Queue built: '+Q.length+' videos');showQ();makePlayer(Q[0].id)}
  else if(p.v){Q=[{id:p.v,title:'Single video'}];qi=0;showQ();makePlayer(p.v)}
  else L('Could not parse URL')
 }catch(e){S('EXTRACT ERROR');L(e.message);L('If this says CORS, pure GitHub Pages cannot call YouTube’s internal endpoint directly from Safari.')}
}
$('load').onclick=load;$('url').onkeydown=e=>{if(e.key==='Enter')load()};$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('play').onclick=()=>{try{yt.playVideo()}catch{}};
$('vol').oninput=e=>{userVol=+e.target.value;$('vtxt').textContent=userVol+'%';if(ready)yt.setVolume(userVol)};$('duck').oninput=e=>$('dtxt').textContent=e.target.value+'%';
window.onYouTubeIframeAPIReady=()=>L('YouTube player API loaded');let sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);
</script></body></html>
